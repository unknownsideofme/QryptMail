name: End-to-End Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm --prefix qrypt.mail.frontend install
        npm --prefix qrypt.mail.server install
        npm install

    - name: Install Playwright Chrome Browser
      run: npx playwright install chrome --with-deps

    - name: Run E2E tests
      env:
        DB_TYPE: mongo
        MONGODB_URI: mongodb://localhost:27017/qryptmail
        NODE_ENV: test
        PORT: 5001
        JWT_SECRET: testingsecretqrypt
      run: npm run test:e2e
